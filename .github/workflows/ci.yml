name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm contract-check

  perf:
    # Native amd64 Postgres, so the p95 budget in *.perf.test.ts is enforced here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf

  image:
    # The API container builds and answers its health check (no database: in-memory storage).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t amexbutikker-api .
      - name: Health check
        run: |
          docker run -d --name api -p 3000:3000 \
            -e STORAGE=memory -e DATABASE_URL=postgres://unused@localhost/unused \
            -e DEVICE_TOKEN_SECRET="$(openssl rand -base64 48)" amexbutikker-api
          for i in $(seq 1 30); do curl -sf localhost:3000/health && exit 0; sleep 1; done
          docker logs api
          exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm contract-check

  perf:
    # Native amd64 Postgres, so the p95 budget in *.perf.test.ts is enforced here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf

  image:
    # The container builds, answers its health check and serves the web app (in-memory storage).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t amexbutikker .
      - name: Health check and web app
        run: |
          docker run -d --name app -p 3000:3000 \
            -e STORAGE=memory -e DATABASE_URL=postgres://unused@localhost/unused \
            -e DEVICE_TOKEN_SECRET="$(openssl rand -base64 48)" amexbutikker
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
          curl -sf localhost:3000/health
          curl -sf localhost:3000/ | grep -q '<html' || { docker logs app; exit 1; }
          curl -sf 'localhost:3000/v1/places/search?q=kafe' | grep -q results

  publish:
    # main only: the image for the home simple-k8s, amd64 and arm64, at ghcr.io/vaarvik/amexbutikker.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Public by design (it is in the page); set the repository variable once the widget exists.
          build-args: |
            EXPO_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/vaarvik/amexbutikker:main
            ghcr.io/vaarvik/amexbutikker:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
